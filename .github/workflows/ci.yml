name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  API_STR: /api
  CORS_ORIGINS: http://localhost:3000
  DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mentoria_test
  JWT_SECRET: test-secret-that-is-long-enough-for-ci
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  MAIL_HOST: smtp.example.com
  MAIL_PORT: "587"
  MAIL_USERNAME: ci-user
  MAIL_PASSWORD: ci-password
  MAIL_FROM: no-reply@example.com
  MAIL_FROM_NAME: Sistema de Monitoria
  MAIL_VALIDATE_CERTS: "false"

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check critical Python errors
        run: ruff check . --select E9,F63,F7,F82

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -q

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mentoria-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
